[project]
name = "rl-tallerdp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sara Castillejo Ditta", email = "scastillejoditta@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "gymnasium>=1.3.0",
    "hydra-core>=1.3.8",
    "matplotlib>=3.11.2",
    "mlflow>=3.17.2",
    "numpy>=2.5.3",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
]

[project.scripts]
rl-tallerdp = "rl_tallerdp:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
